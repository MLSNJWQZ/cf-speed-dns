name: dns_both_push

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-domain1:
    runs-on: ubuntu-latest
    steps:
      # 修改点1：升级到 v7，修复安全漏洞并消除警告
      - name: Checkout
        uses: actions/checkout@v7

      # 修改点2：升级到 v6，彻底解决 Node.js 20 弃用警告
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update Domain 1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_DNS_NAME: ${{ secrets.CF_DNS_NAME }}
          # 修改点3：补全 Secret 引用，防止推送失败
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python dnscf.py

  update-domain2:
    runs-on: ubuntu-latest
    steps:
      # 修改点1：升级到 v7
      - name: Checkout
        uses: actions/checkout@v7

      # 修改点2：升级到 v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update Domain 2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID_2 }}
          CF_DNS_NAME: ${{ secrets.CF_DNS_NAME_2 }}
          # 修改点3：补全 Secret 引用
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python dnscf.py

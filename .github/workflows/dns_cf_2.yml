name: dns_cf_push_2

on:
  workflow_dispatch: # 支持手动运行
  schedule:
    - cron: '0 */6 * * *' # 每6小时自动运行一次

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: run dnscf
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID_2 }}
          CF_DNS_NAME: ${{ secrets.CF_DNS_NAME_2 }}
          PUSHPLUS_TOKEN:
        run: python dnscf.py
